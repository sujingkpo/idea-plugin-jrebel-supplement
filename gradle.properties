# 让 Kotlin 插件自动添加 stdlib 2.4.10 作为 runtime 依赖并打包进插件：
# 2022.2.5 平台自带 stdlib 只有 1.7.x，无法运行 Kotlin 2.4 编译的代码，插件必须自带 stdlib
# (此前 kotlin.stdlib.default.dependency=false 依赖平台 stdlib，仅适用于只支持新版本时)
# 可选：显式指定本机 JDK 11 路径供 Gradle toolchain(11) 检测；留空则由 Foojay 自动下载
# org.gradle.java.installations.paths=/path/to/jdk-11
